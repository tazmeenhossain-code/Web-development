<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Solar System</title>
    <style>
        .description{
            background-color: rgb(5, 5, 107);
            color: aliceblue;
            margin: 10px;
            padding: 15px;
        }
        .Aboutthesolarsystem{
            background-color: cornflowerblue;
            color: cornsilk;
            margin: 10px;
            padding: 15px;
        }
        .About{
            background-color: aqua;
              color: rgb(0, 138, 126);
            margin: 10px;
            padding: 15px;
        }
    </style>
</head>
<body>
    
    <h1 class="description">Solar system</h1>
    <script>
       let description=document.createElement('h2');
        description.className="Aboutthesolarsystem";
        description.innerHTML="About the solar system"
        document.body.append(description)
        
        let about=document.createElement('p');
        about.className="About";
        about.innerHTML="The solar system formed about 4.5 to 4.6 billion years ago from a collapsing cloud of gas and dust, centered around the Sun in the Milky Way's Orion Arm. It contains the Sun, eight planets, dwarf planets, hundreds of moons, asteroids, and comets."
        document.body.append(about)
        </script>
