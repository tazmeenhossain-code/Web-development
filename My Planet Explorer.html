<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Planet Explorer</title>
    <link rel="stylesheet"

href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

</script>
<body>
   <nav class="navbar" style="background-color: rgb(47, 8, 93); color: white;">
    <a class="navbar-brand" href="#">Planet explorer</a>
<ul class="navbar-nav"></ul>
<li class="nav-item">Home</li>
<li class="nav-item">Planets</li>
<li class="nav-item">Stars</li>
   </nav> 

<div class="container">
    <h4 class=section-title>Scanning the galaxy</h4>
    <div class="spinner-border text-primary"></div>
    <div class="spinner-border text-warning"></div>
    <div class="spinner-border"></div>
</div>

<!--Topic: Cards-->
<h4>Featured planets</h4>
<div class="row" style="margin: 10px; gap: 10px;">
    <div class="card " style=" width: 250px; height: 150px;  border: 5px solid blue;">
        <div class="card-body" style="background-color: aliceblue;">
    <h5 class="card-title text-primary">
             Earth
    </h5>
    <p class="card-text">
        Our home planet-the only one known to have life!
    </p>
    </div>
    </div>
    <div class="card" style="width: 250px; height: 150px;  border: 5px solid rgb(240, 49, 49);">
        <div class="card-body" style="background-color: rgb(255, 167, 167);">
    <h5 class="card-title" style="color: red;">
             Mars
    </h5>
    <p class="card-text">
        The red planet
    </p>
    </div>
    </div>
     <div class="card" style="width: 250px; height: 150px;  border: 5px solid rgb(94, 255, 255);">
        <div class="card-body" style="background-color: rgb(191, 250, 230);">
    <h5 class="card-title" style="color: rgb(13, 198, 115);">
             Uranus
    </h5>
    <p class="card-text">
        The coldest planet in the solar system.
    </p>
    </div>
    </div>
</div>







</body>
</html>
