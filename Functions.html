<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions in Javascript</title>
</head>
<body>
    <h1>Welcome to functions in Javascript</h1>
    <script>
        function sumOfnumber(){
          let num1,num2,result;
          num1=7;
          num2=9;
            result=num1+num2;

            return result;


        }
        let sum=sumOfnumber();
        console.log("The sum of two numbers is: "+sum);

        function differenceOfnumber(){
          let num3,num4,result;
          num3=15;
          num4=8;
            result=num3-num4;

            return result;


        }
        let difference=differenceOfnumber();
        console.log("The difference of two numbers is: "+difference);

        function multiplicationOfnumber(){
          let num5,num6,result3;
          num5=16;
          num6=9;
            result3=num5*num6;

            return result3;


        }
        let multiplication=multiplicationOfnumber();
        console.log("The multiplication of two numbers is: "+multiplication);

        function divisionOfnumber(){
          let num7,num8,result4;
          num7=63;
          num8=7;
            result4=num7/num8;

            return result4;


        }
        let division=divisionOfnumber();
        console.log("The division of two numbers is: "+division);
    </script>
</body>
</html>
